<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-hiera">
  <defs>
    <linearGradient id="hiera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#hiera)"/>
  <!-- Hierarchy: three stacked rounded bars narrowing top-to-bottom,
       the layered data sources a lookup walks down. -->
  <g fill="#FFFFFF">
    <rect x="56" y="72"  width="144" height="28" rx="14"/>
    <rect x="72" y="114" width="112" height="28" rx="14"/>
    <rect x="88" y="156" width="80"  height="28" rx="14"/>
  </g>
</svg>
